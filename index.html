<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Beat Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="#">BEAT<span>STORE</span></a>
    <button id="loginBtn">Prihlásiť sa</button>
  </header>

  <main>
    <section class="hero">
      <p class="tag">YOUR SOUND. YOUR STYLE.</p>
      <h1>Nájdi svoj<br><span>vlastný sound.</span></h1>
      <p class="intro">Objavuj beaty, počúvaj ukážky a vyber si tie, ktoré chceš stiahnuť.</p>
      <a class="discover" href="#beats">OBJAVIŤ BEATY ↓</a>
    </section>

    <section id="beats">
      <p class="tag">BEAT COLLECTION</p>
      <h2>Najnovšie beaty</h2>
      <div id="beatList" class="beat-list">
        <p class="empty">Beaty pripravujeme. Čoskoro tu nájdeš našu kolekciu.</p>
      </div>
    </section>
  </main>

  <footer>© 2026 BEAT STORE</footer>
  <script src="app.js"></script>
</body>
</html>
